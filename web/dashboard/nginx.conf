# Static dashboard only. Envoy is the one client: mTLS with certificates from
# the internal-services Sub CA (docs/SECURITY/INTERNAL_TLS.md). API calls
# (/svc, /auth) are routed by Envoy straight to the services over mTLS.
server {
  listen 5173 ssl;
  server_name _;

  ssl_certificate         /run/vecta/dashboard-tls/tls.crt;
  ssl_certificate_key     /run/vecta/dashboard-tls/tls.key;
  ssl_protocols           TLSv1.3;
  # Chain to the root for path building, but accept only clients issued by
  # the internal-services Sub CA.
  ssl_client_certificate  /run/vecta/trust/internal-chain.crt;
  ssl_verify_client       on;
  ssl_verify_depth        2;
  if ($ssl_client_i_dn !~ "CN=vecta-internal-services") {
    return 403;
  }

  root /usr/share/nginx/html;
  index index.html;

  # ── Hide Nginx version from Server header and error pages ─────────────────
  server_tokens off;

  # ── Connection performance ────────────────────────────────────────────────
  keepalive_timeout 65;
  tcp_nopush  on;
  tcp_nodelay on;

  # ── Request limits (DoS / large-payload protection) ──────────────────────
  client_max_body_size     4m;    # reject bodies > 4 MB before they hit upstream
  client_body_timeout      15s;   # kill slow-upload connections
  client_header_timeout    15s;   # kill slow-header connections
  send_timeout             30s;

  # ── Gzip compression ─────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/woff2;

  # ── Security headers (applied to all responses) ──────────────────────────
  add_header X-Frame-Options                    "DENY"                                            always;
  add_header X-Content-Type-Options             "nosniff"                                         always;
  add_header Referrer-Policy                    "strict-origin-when-cross-origin"                 always;
  add_header Permissions-Policy                 "camera=(), microphone=(), geolocation=(), payment=()" always;
  # HSTS: enforce HTTPS for 1 year, include subdomains, allow preload list
  add_header Strict-Transport-Security          "max-age=31536000; includeSubDomains; preload"    always;
  # Isolate this browsing context from other origins (clickjacking + Spectre)
  add_header Cross-Origin-Opener-Policy         "same-origin"                                     always;
  # Prevent other origins from loading our resources into their context
  add_header Cross-Origin-Resource-Policy       "same-origin"                                     always;
  # Embed policy: only allow embedding from same origin
  add_header Cross-Origin-Embedder-Policy       "require-corp"                                    always;
  # Prevent DNS prefetching of external resources to avoid information leakage
  add_header X-DNS-Prefetch-Control             "off"                                             always;
  # Block Adobe cross-domain policy files
  add_header X-Permitted-Cross-Domain-Policies  "none"                                            always;
  # CSP: self-only; wasm-unsafe-eval for crypto modules; ws/wss for live feed
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    always;

  # ── index.html — never cache ──────────────────────────────────────────────
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header X-Frame-Options                    "DENY"                                            always;
    add_header X-Content-Type-Options             "nosniff"                                         always;
    add_header Referrer-Policy                    "strict-origin-when-cross-origin"                 always;
    add_header Permissions-Policy                 "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security          "max-age=31536000; includeSubDomains; preload"    always;
    add_header Cross-Origin-Opener-Policy         "same-origin"                                     always;
    add_header Cross-Origin-Resource-Policy       "same-origin"                                     always;
    add_header Cross-Origin-Embedder-Policy       "require-corp"                                    always;
    add_header X-DNS-Prefetch-Control             "off"                                             always;
    add_header X-Permitted-Cross-Domain-Policies  "none"                                            always;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
      always;
    expires -1;
    try_files $uri =404;
  }

  # ── Hashed assets — immutable cache ──────────────────────────────────────
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options             "nosniff"                                         always;
    add_header X-Frame-Options                    "DENY"                                            always;
    add_header Referrer-Policy                    "strict-origin-when-cross-origin"                 always;
    add_header Strict-Transport-Security          "max-age=31536000; includeSubDomains; preload"    always;
    add_header Cross-Origin-Resource-Policy       "same-origin"                                     always;
    add_header X-DNS-Prefetch-Control             "off"                                             always;
    add_header X-Permitted-Cross-Domain-Policies  "none"                                            always;
    try_files $uri =404;
  }

  # ── SPA fallback ──────────────────────────────────────────────────────────
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header X-Frame-Options                    "DENY"                                            always;
    add_header X-Content-Type-Options             "nosniff"                                         always;
    add_header Referrer-Policy                    "strict-origin-when-cross-origin"                 always;
    add_header Permissions-Policy                 "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security          "max-age=31536000; includeSubDomains; preload"    always;
    add_header Cross-Origin-Opener-Policy         "same-origin"                                     always;
    add_header Cross-Origin-Resource-Policy       "same-origin"                                     always;
    add_header Cross-Origin-Embedder-Policy       "require-corp"                                    always;
    add_header X-DNS-Prefetch-Control             "off"                                             always;
    add_header X-Permitted-Cross-Domain-Policies  "none"                                            always;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
      always;
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
