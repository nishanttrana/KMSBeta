# pg_hba.conf — Vecta KMS (docs/SECURITY/INTERNAL_TLS.md)
# Network connections: TLS only (ssl_min_protocol_version = TLSv1.3), with a
# client certificate that chains to the internal Vecta CA AND the SCRAM
# password. Plaintext TCP is rejected.
#
# TYPE     DATABASE     USER  ADDRESS          METHOD

# Local socket inside the container: pg_isready health check and admin exec.
local      all          all                    scram-sha-256

# Service network (kms_net). clientcert=verify-ca: the certificate must chain
# to the internal CA; CN isn't compared with the database user.
hostssl    all          all   172.16.0.0/12    scram-sha-256 clientcert=verify-ca
hostssl    replication  all   172.16.0.0/12    scram-sha-256 clientcert=verify-ca

# The node's own pod (Kubernetes chart, docs/KUBERNETES.md): the services
# share the pod's network and reach Postgres on loopback, with the same mTLS.
hostssl    all          all   127.0.0.1/32     scram-sha-256 clientcert=verify-ca

# Cluster members' replication roles (docs/CLUSTERING.md) from other hosts:
# TLS and a 256-bit generated password. A subscription presents no client
# certificate, so the rule above would refuse every member.
hostssl    all          /^vecta_repl_   0.0.0.0/0   scram-sha-256
hostssl    all          /^vecta_repl_   ::/0        scram-sha-256

# Everything else, and every non-TLS connection, is refused.
hostnossl  all          all   0.0.0.0/0        reject
host       all          all   0.0.0.0/0        reject
host       all          all   ::/0             reject
