bind * -::*
protected-mode yes
# Internal mTLS only (docs/SECURITY/INTERNAL_TLS.md): no plaintext port; a
# client certificate chaining to the internal CA is required, plus the
# password (VALKEY_PASSWORD, generated by the installers and passed with
# --requirepass). The Unix socket serves only in-container admin and the
# health check.
port 0
tls-port 6379
tls-cert-file /etc/vecta-tls/tls.crt
tls-key-file /etc/vecta-tls/tls.key
tls-ca-cert-file /etc/vecta-tls/internal-chain.crt
tls-auth-clients yes
tls-protocols "TLSv1.3"
unixsocket /tmp/valkey.sock
unixsocketperm 700

# Authentication - use env var in production instead of hardcoded password

dir /data
dbfilename dump.rdb

appendonly yes
appenddirname appendonlydir
appendfsync everysec

save 3600 1 300 100 60 10000

io-threads 2
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Memory eviction policy
maxmemory-policy allkeys-lru

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "VECTA_CONFIG"
