{{- /* Generated once and kept: an upgrade reads the existing Secret. */ -}}
{{- if not .Values.existingSecret }}
{{- $name := include "vecta.secretName" . }}
{{- $data := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace $name) }}{{- $data = merge (dict) .data }}{{- end }}
{{- range $k := list "POSTGRES_PASSWORD" "NATS_AUTH_TOKEN" "VALKEY_PASSWORD" }}
{{- if not (hasKey $data $k) }}{{- $_ := set $data $k (randAlphaNum 48 | b64enc) }}{{- end }}
{{- end }}
{{- range $k := list "WORKLOAD_IDENTITY_SHARED_SECRET" "INTERNAL_API_TOKEN" "INTERNAL_SERVICE_BOOTSTRAP_SECRET" }}
{{- if not (hasKey $data $k) }}{{- $_ := set $data $k (randAlphaNum 64 | b64enc) }}{{- end }}
{{- end }}
{{- if not (hasKey $data "AUTH_BOOTSTRAP_CLI_PASSWORD") }}
{{- $_ := set $data "AUTH_BOOTSTRAP_CLI_PASSWORD" (printf "Vk%sAa9!" (randAlphaNum 24) | b64enc) }}
{{- end }}
{{- if not (hasKey $data "jwt_private.pem") }}
{{- /* Auth's token signing key. Services verify with a certificate for it:
       Helm can make one from a key but cannot print the bare public key, and
       pkg/jwtauth accepts either. */}}
{{- $key := genPrivateKey "rsa" }}
{{- $cert := genSelfSignedCertWithKey "vecta-auth-jwt" nil nil 36500 $key }}
{{- $_ := set $data "jwt_private.pem" ($key | b64enc) }}
{{- $_ := set $data "JWT_PUBLIC_KEY_B64" ($cert.Cert | b64enc | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vecta.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
