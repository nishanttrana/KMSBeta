{{- /*
One KMS node: the containers docker-compose.yml runs on one host, in one pod
(files/stack.json, generated by scripts/helm-chart.sh). certs and the
infrastructure daemons start first as native sidecars, in order; the services
start once Postgres answers, as compose's depends_on does. Compose service
names resolve to the pod itself (hostAliases), so every internal URL and
certificate name is the one compose uses.
*/ -}}
{{- $stack := .Files.Get "files/stack.json" | fromJson }}
{{- $profiles := (include "vecta.profiles" . | fromJson).profiles }}
{{- $ov := include "vecta.envOverrides" . | fromJson }}
{{- $fullname := include "vecta.fullname" . }}
{{- $secret := include "vecta.secretName" . }}
{{- $tag := include "vecta.tag" . }}
{{- $enabled := list }}
{{- range $s := $stack.services }}
{{- $on := eq (len $s.profiles) 0 }}
{{- range $p := $s.profiles }}{{- if has $p $profiles }}{{- $on = true }}{{- end }}{{- end }}
{{- if $on }}{{- $enabled = append $enabled $s }}{{- end }}
{{- end }}
{{- $groups := list }}
{{- range $s := $enabled }}{{- range $g := ($s.groupAdd | default list) }}{{- $groups = append $groups (int $g) }}{{- end }}{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vecta.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $fullname }}-node
  selector:
    matchLabels:
      {{- include "vecta.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vecta.selector" . | nindent 8 }}
      annotations:
        checksum/infra: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            {{- range $h := $stack.hostnames }}
            - {{ $h }}
            {{- end }}
      securityContext:
        # Envoy binds 443 as a non-root user, as Docker allows by default.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        {{- with (uniq $groups) }}
        supplementalGroups: {{ toJson . }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare
          image: {{ .Values.images.prepare }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/cfg/prepare.sh"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - { name: data, mountPath: /pv }
            - { name: data, mountPath: /data, subPath: certs-key-data }
            {{- range $vol, $spec := $stack.memoryVolumes }}
            - { name: mem-{{ $vol }}, mountPath: /mem/{{ $vol }} }
            {{- end }}
            - { name: infra, mountPath: /cfg, readOnly: true }
            - name: jwt
              mountPath: /jwt
              readOnly: true
        {{- range $s := $enabled }}
        {{- if $s.sidecar }}
        {{- include "vecta.container" (dict "root" $ "s" $s "ov" $ov "secret" $secret "tag" $tag) | nindent 8 }}
          restartPolicy: Always
        {{- end }}
        {{- end }}
      containers:
        {{- range $s := $enabled }}
        {{- if not $s.sidecar }}
        {{- include "vecta.container" (dict "root" $ "s" $s "ov" $ov "secret" $secret "tag" $tag) | nindent 8 }}
        {{- end }}
        {{- end }}
      volumes:
        - name: infra
          configMap:
            name: {{ $fullname }}-infra
            defaultMode: 0555
        - name: jwt
          secret:
            secretName: {{ $secret }}
            items:
              - { key: jwt_private.pem, path: jwt_private.pem }
            defaultMode: 0400
        {{- range $vol, $spec := $stack.memoryVolumes }}
        - name: mem-{{ $vol }}
          emptyDir:
            medium: Memory
            sizeLimit: {{ index $spec 2 }}
        {{- end }}
        {{- range $s := $enabled }}
        {{- if $s.shm }}
        - name: shm-{{ $s.name }}
          emptyDir:
            medium: Memory
            sizeLimit: {{ $s.shm }}
        {{- end }}
        {{- range $m := $s.mounts }}
        {{- if $m.configDir }}
        - name: dir-{{ $s.name }}-{{ $m.configDir | trunc 40 | trimSuffix "-" }}
          configMap:
            name: {{ $fullname }}-infra
            defaultMode: 0444
            items:
              {{- range $f := $m.files }}
              - { key: {{ $f.key }}, path: {{ $f.path }} }
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toJson .Values.persistence.accessModes }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

{{- define "vecta.container" -}}
{{- $root := .root }}{{- $s := .s }}{{- $ov := .ov }}
{{- $image := $s.image }}
{{- if $s.vecta }}{{- $image = printf "%s%s:%s" $root.Values.image.registry $s.image .tag }}{{- end }}
{{- with (index $root.Values.images $s.name) }}{{- $image = . }}{{- end }}
{{- $env := dict }}
{{- range $e := $s.env }}{{- $_ := set $env $e.name (replace "__VECTA_VERSION__" $.tag $e.value) }}{{- end }}
{{- range $k, $v := $ov }}{{- if hasKey $env $k }}{{- $_ := set $env $k $v }}{{- end }}{{- end }}
{{- range $k, $v := $root.Values.env }}{{- $_ := set $env $k (toString $v) }}{{- end }}
{{- range $k, $v := (index $root.Values.serviceEnv $s.name | default dict) }}{{- $_ := set $env $k (toString $v) }}{{- end }}
- name: {{ $s.name }}
  image: {{ $image }}
  imagePullPolicy: {{ $root.Values.image.pullPolicy }}
  {{- with $s.entrypoint }}
  command: {{ toJson . }}
  {{- end }}
  {{- with $s.command }}
  args: {{ toJson . }}
  {{- end }}
  env:
    {{- range $k := $s.secretEnv }}
    - name: {{ $k }}
      valueFrom:
        secretKeyRef: { name: {{ $.secret }}, key: {{ $k }} }
    {{- end }}
    {{- range $k, $v := $env }}
    - name: {{ $k }}
      value: {{ $v | quote }}
    {{- end }}
  {{- with $s.ports }}
  ports:
    {{- range $p := . }}
    - { name: p{{ $p }}, containerPort: {{ $p }} }
    {{- end }}
  {{- end }}
  {{- with $s.probe }}
  readinessProbe:
    exec: { command: {{ toJson . }} }
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 10
  {{- if $s.startupProbe }}
  startupProbe:
    exec: { command: {{ toJson . }} }
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 120
  {{- end }}
  {{- end }}
  {{- with $s.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- if $s.runAsUser }}
    runAsUser: {{ $s.runAsUser }}
    runAsGroup: {{ $s.runAsGroup }}
    {{- end }}
    {{- if $s.noNewPrivileges }}
    allowPrivilegeEscalation: false
    {{- end }}
    {{- if $s.dropAll }}
    capabilities: { drop: [ALL] }
    {{- end }}
  volumeMounts:
    {{- if $s.shm }}
    - { name: shm-{{ $s.name }}, mountPath: /dev/shm }
    {{- end }}
    {{- range $m := $s.mounts }}
    {{- if $m.data }}
    - { name: data, mountPath: {{ $m.mountPath }}, subPath: {{ $m.data }}{{ if $m.readOnly }}, readOnly: true{{ end }} }
    {{- else if $m.memory }}
    - { name: mem-{{ $m.memory }}, mountPath: {{ $m.mountPath }}{{ if $m.readOnly }}, readOnly: true{{ end }} }
    {{- else if $m.config }}
    - { name: infra, mountPath: {{ $m.mountPath }}, subPath: {{ $m.config }}, readOnly: true }
    {{- else if $m.configDir }}
    - { name: dir-{{ $s.name }}-{{ $m.configDir | trunc 40 | trimSuffix "-" }}, mountPath: {{ $m.mountPath }}, readOnly: true }
    {{- else if $m.deployment }}
    - { name: infra, mountPath: {{ $m.mountPath }}, subPath: deployment.yaml, readOnly: true }
    {{- end }}
    {{- end }}
{{- end -}}
