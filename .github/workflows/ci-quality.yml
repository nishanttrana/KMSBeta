name: CI Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  docs-with-change:
    name: Documentation ships with the change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check docs updated
        run: ./scripts/check-docs.sh "origin/${{ github.base_ref }}"

  fips-modes:
    # Every customer-selectable FIPS 140-3 mode must pass the full suite on the
    # certified Go Cryptographic Module (docs/SECURITY/FIPS.md).
    name: Go tests — FIPS mode ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["off", "on", "only"]
    env:
      GOFIPS140: v1.0.0
      GODEBUG: fips140=${{ matrix.mode }}
      VECTA_REQUIRE_CERTIFIED_MODULE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go test (fips140=${{ matrix.mode }})
        run: go test ./pkg/... ./services/...

  cluster-replication:
    # Two real Postgres 17 servers: selective per-component logical replication
    # (docs/CLUSTERING.md).
    name: Cluster replication (two-node Postgres)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Two-node replication test
        run: ./scripts/test-cluster-replication.sh

  dashboard-quality:
    name: Dashboard Lint/Type/Unit/Build/Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate REST catalog
        run: npm run generate:rest-catalog

      - name: Validate OpenAPI artifacts
        run: npm run validate:openapi

      - name: Lint
        run: npm run lint

      - name: Component size gate
        run: npm run check:component-size

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Security scan (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:smoke

  backend-quality:
    name: Backend RuntimeCfg/Vet/Test/Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Runtime config validation gate
        run: |
          chmod +x infra/scripts/check-runtimecfg.sh
          infra/scripts/check-runtimecfg.sh

      - name: Platform conformance (central crypto, single audit, secure defaults)
        run: ./scripts/conformance.sh -v

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
