name: CI Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  docs-with-change:
    # On every push as well as on pull requests: changes reach main without a
    # pull request, so until 13.17.0-beta this job never ran.
    name: Documentation ships with the change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check docs updated
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: ./scripts/check-docs.sh "$BASE"

  fips-modes:
    # Every customer-selectable FIPS 140-3 mode must pass the full suite on the
    # certified Go Cryptographic Module (docs/SECURITY/FIPS.md).
    name: Go tests — FIPS mode ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: ["off", "on", "only"]
    env:
      GOFIPS140: v1.0.0
      GODEBUG: fips140=${{ matrix.mode }}
      VECTA_REQUIRE_CERTIFIED_MODULE: "1"
      # An HSM test fails without the library; it never passes by skipping.
      VECTA_REQUIRE_SOFTHSM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Built from a pinned commit: the Ubuntu package (2.6.1) and the 2.7.0
      # release cannot do the SHA-256 wrap cloud BYOK uses, and three HSM
      # tests failed on every push for it (scripts/install-softhsm.sh).
      - name: Install SoftHSM (a real PKCS#11 library for the HSM tests)
        run: |
          scripts/install-softhsm.sh "$HOME/softhsm"
          echo "SOFTHSM_LIB=$HOME/softhsm/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "$HOME/softhsm/bin" >> "$GITHUB_PATH"

      - name: Setup OpenJDK (the JCA provider's real-consumer test)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: go test (fips140=${{ matrix.mode }})
        env:
          VECTA_REQUIRE_JDK: "1"
        run: scripts/ci-go-test.sh ./pkg/... ./services/...

      - name: Cross-build the Windows customer agent
        run: GOOS=windows GOARCH=amd64 go build ./services/ekm-agent/...

      # The SDK ships this pom; until 13.40.0-beta it named a plugin Maven
      # Central doesn't have and nothing built it. Built as a customer does.
      - name: Build the JCA provider with Maven (as shipped in the SDK)
        if: matrix.mode == 'off'
        working-directory: services/jca-provider
        run: mvn -B -q -Ddependency-check.skip=true verify

  race:
    # Data races make tests fail now and then; the race detector finds them
    # every time. Two were found this way (13.8.0-beta).
    name: Go tests — race detector
    runs-on: ubuntu-latest
    env:
      GOFIPS140: v1.0.0
      VECTA_REQUIRE_SOFTHSM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install SoftHSM (a real PKCS#11 library for the HSM tests)
        run: |
          scripts/install-softhsm.sh "$HOME/softhsm"
          echo "SOFTHSM_LIB=$HOME/softhsm/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "$HOME/softhsm/bin" >> "$GITHUB_PATH"

      - name: go test -race
        run: scripts/ci-go-test.sh -race ./pkg/... ./services/...
      - name: Go SDK (sdk/go is its own module; the root ./... doesn't reach it)
        run: cd sdk/go && go vet ./... && go test -race -count=1 ./...
      - name: Python and Node SDKs (their unit tests; TestSDKsAgainstKeycore runs them against keycore)
        run: |
          python3 -m unittest discover -s sdk/python/tests
          (cd sdk/node && node --test test/client.test.mjs)
      - name: Terraform provider (its own module; the tests download a checksum-verified Terraform and run real plans and applies)
        run: cd sdk/terraform-provider-vecta && go vet ./... && go test -count=1 ./... && go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: PKCS#11 module (unit tests under ASan/UBSan, then against keycore with pkcs11-tool)
        env:
          VECTA_REQUIRE_PKCS11: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev opensc
          make -C sdk/pkcs11 check
          go test -count=1 -run 'TestPKCS11AgainstKeycore' ./services/keycore

  cluster-replication:
    # Three real Postgres 17 servers: selective per-component logical
    # replication, the secure join and failover (docs/CLUSTERING.md).
    name: Cluster replication and failover (three-node Postgres)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Replication, join and failover tests
        run: ./scripts/test-cluster-replication.sh

  helm-chart:
    # The Helm chart is generated from docker-compose.yml, lints and renders
    # valid Kubernetes manifests (docs/KUBERNETES.md). The kind install test,
    # which needs the images, is scripts/test-helm-kind.sh.
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install helm and kubeconform
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install helm.sh/helm/v3/cmd/helm@v3.16.3
          GOBIN="$RUNNER_TEMP/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Chart gate
        run: HELM="$RUNNER_TEMP/bin/helm" KUBECONFORM="$RUNNER_TEMP/bin/kubeconform" ./scripts/check-helm-chart.sh

  volume-repair:
    # Real Docker volumes: scripts create volumes Compose adopts, and an
    # upgrade moves runtime-certs to tmpfs without losing a persistent volume
    # (infra/scripts/compose-volumes.sh).
    name: Volume repair (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Volume repair test
        run: ./scripts/test-volume-repair.sh

  integration-postgres:
    # Backup/restore, signing, the backup service, the secrets MEK migration,
    # the audit, alert and posture statistics (window bounds, GROUP BY and the
    # posture baseline) and HSM key storage (with SoftHSM2) against real Postgres: they rely on information_schema, JSONB,
    # TRUNCATE ... CASCADE and BYTEA/row-value comparisons, which SQLite cannot
    # prove. The database is disposable.
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-6f1d2c9a7b4e
          POSTGRES_DB: vecta_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vecta_it"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      GOFIPS140: v1.0.0
      VECTA_REQUIRE_SOFTHSM: "1"
      VECTA_TEST_POSTGRES_DSN: postgres://postgres:ci-disposable-6f1d2c9a7b4e@localhost:5432/vecta_it?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Built from a pinned commit: the Ubuntu package (2.6.1) and the 2.7.0
      # release cannot do the SHA-256 wrap cloud BYOK uses, and three HSM
      # tests failed on every push for it (scripts/install-softhsm.sh).
      - name: Install SoftHSM (a real PKCS#11 library for the HSM tests)
        run: |
          scripts/install-softhsm.sh "$HOME/softhsm"
          echo "SOFTHSM_LIB=$HOME/softhsm/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "$HOME/softhsm/bin" >> "$GITHUB_PATH"

      - name: Integration tests (run serially; they share the database)
        run: scripts/ci-go-test.sh -count=1 -p 1 -run 'Postgres|Preview|Simulated' ./services/auth ./services/certs ./services/dataprotect ./services/discovery ./services/compliance ./services/cloud ./services/ekm ./services/governance ./services/signing ./services/secrets ./services/keycore ./services/audit ./services/workload ./services/posture ./services/reporting ./pkg/mek ./pkg/clusterstate

      # Needs a NATS server, so it skipped in every other job: until
      # 13.4.0-beta nothing in CI ran it.
      - name: The audit-event watcher on a real NATS server (secrets)
        run: |
          docker run -d --name ci-nats -p 127.0.0.1:4222:4222 nats:2.14.7-alpine -js
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null && break; sleep 1; done
          VECTA_TEST_NATS_URL=nats://127.0.0.1:4222 go test -count=1 -run '^TestWatchSubjectsNATS$' -v ./services/secrets | tee "$RUNNER_TEMP/nats-test.log"
          grep -q -- '--- PASS: TestWatchSubjectsNATS' "$RUNNER_TEMP/nats-test.log"

      # An AWS KMS implementation this code was not written against: it
      # unwraps what is imported and encrypts with it. It checks no request
      # signature and takes no material back, so the altered credential, the
      # renewal and the restore are left to a run on AWS itself
      # (docs/SECURITY/CLOUD_BYOK_LIVE_VERIFICATION.md).
      - name: Cloud BYOK import, use, rotation and revoke on an AWS KMS emulator (LocalStack)
        env:
          VECTA_TEST_BYOK_AWS_EMULATOR: "1"
          VECTA_TEST_BYOK_AWS_ENDPOINT: http://127.0.0.1:4566
          VECTA_TEST_BYOK_AWS_ACCESS_KEY: test
          VECTA_TEST_BYOK_AWS_SECRET_KEY: test-only-0000000000000000000000000000000
          VECTA_TEST_BYOK_AWS_REGION: us-east-1
        run: |
          docker run -d --name ci-localstack -e SERVICES=kms -p 127.0.0.1:4566:4566 localstack/localstack:4.14.0
          for i in $(seq 1 60); do curl -s http://127.0.0.1:4566/_localstack/health | grep -q '"kms"' && break; sleep 2; done
          go test ./services/cloud/ -run '^TestLiveCloudBYOK$' -count=1 -v | tee "$RUNNER_TEMP/byok-emulator.log"
          grep -q -- '--- PASS: TestLiveCloudBYOK' "$RUNNER_TEMP/byok-emulator.log"

      - name: Edge key exchange through a real Envoy (hot restart, measured by handshake)
        env:
          VECTA_TEST_ENVOY_IMAGE: envoyproxy/envoy:v1.39.1
        run: go test -count=1 -run 'RealEnvoy' ./services/certs

      - name: The address the edge appends and the headers it removes, on a real Envoy (pkg/clientip, pkg/correlation)
        env:
          VECTA_TEST_ENVOY_IMAGE: envoyproxy/envoy:v1.39.1
        run: go test -count=1 -run 'RealEnvoy' ./pkg/clientip ./pkg/correlation

  dashboard-quality:
    name: Dashboard Lint/Type/Unit/Build/Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate REST catalog
        run: npm run generate:rest-catalog

      - name: Validate OpenAPI artifacts
        run: npm run validate:openapi

      - name: Lint
        run: npm run lint

      - name: Component size gate
        run: npm run check:component-size

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Security scan (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:smoke

  backend-quality:
    name: Backend RuntimeCfg/Vet/Test/Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Runtime config validation gate
        run: |
          chmod +x infra/scripts/check-runtimecfg.sh
          infra/scripts/check-runtimecfg.sh

      - name: Platform conformance (central crypto, single audit, secure defaults)
        run: ./scripts/conformance.sh -v

      - name: go vet
        run: go vet ./...

      # With SoftHSM, so the HSM tests are repeated too (they skipped here
      # until 13.11.0-beta, and could not run twice).
      - name: Install SoftHSM (a real PKCS#11 library for the HSM tests)
        run: |
          scripts/install-softhsm.sh "$HOME/softhsm"
          echo "SOFTHSM_LIB=$HOME/softhsm/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"
          echo "$HOME/softhsm/bin" >> "$GITHUB_PATH"

      # Twice in one process: a test that cannot be repeated (shared state
      # left by its first run) fails here, and could not be repeated to look
      # for an intermittent failure either.
      - name: go test (every test twice)
        env:
          GOFIPS140: v1.0.0
          VECTA_REQUIRE_SOFTHSM: "1"
        run: scripts/ci-go-test.sh -count=2 ./...

      # No network at all: a test that needs the Internet or DNS fails here
      # every time, instead of in some run whenever the network does.
      - name: go test with no network
        run: scripts/test-hermetic.sh

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

      # No code that nothing calls, not even a test (13.41.0-beta): dead code
      # hid a client IP allow-list that was stored and never checked.
      - name: No unreachable code
        run: scripts/check-dead-code.sh
