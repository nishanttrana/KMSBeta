server_name: "vecta-kms-nats"
port: 4222

# Internal mTLS only (docs/SECURITY/INTERNAL_TLS.md): a client certificate
# from the internal-services Sub CA is required, plus the token. No HTTP
# monitoring port.
tls {
  cert_file: "/etc/vecta-tls/tls.crt"
  key_file: "/etc/vecta-tls/tls.key"
  ca_file: "/etc/vecta-tls/internal-ca.crt"
  verify: true
  min_version: "1.3"
  timeout: 3
}

# Authentication - use NATS_AUTH_TOKEN env var
authorization {
  token: $NATS_AUTH_TOKEN
}

# Restrict unauthenticated connections
no_auth_user: ""

# Connection and payload limits
max_payload: 1048576
max_connections: 1024

jetstream {
  store_dir: "/data/jetstream"
}
