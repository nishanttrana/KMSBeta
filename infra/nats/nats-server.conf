server_name: "vecta-kms-nats"
port: 4222

# Disable monitoring port (remove external exposure; re-enable on localhost if needed)
# monitor_port: 8222
http: "127.0.0.1:8222"

# Authentication - use NATS_AUTH_TOKEN env var
authorization {
  token: $NATS_AUTH_TOKEN
}

# Restrict unauthenticated connections
no_auth_user: ""

# Connection and payload limits
max_payload: 1048576
max_connections: 1024

jetstream {
  store_dir: "/data/jetstream"
}
