node:
  id: vecta-edge
  cluster: vecta-edge
static_resources:
  listeners:
  - name: http_redirect
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 80
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: edge_http_redirect
          route_config:
            name: redirect_all
            virtual_hosts:
            - name: redirect_host
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                redirect:
                  https_redirect: true
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  - name: https_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 443
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          require_client_certificate: false
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_3
            tls_certificate_sds_secret_configs:
            - name: edge_server
              sds_config:
                path_config_source:
                  path: /etc/envoy/sds/edge_server.yaml
                  watched_directory: { path: /run/vecta/runtime-certs/envoy }
                resource_api_version: V3
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: edge_https
          use_remote_address: true
          forward_client_cert_details: SANITIZE_SET
          set_current_client_cert_details:
            cert: true
            dns: true
            subject: true
            uri: true
          normalize_path: true
          merge_slashes: true
          stream_idle_timeout: 60s
          common_http_protocol_options:
            idle_timeout: 300s
          route_config:
            name: kms_routes
            virtual_hosts:
            - name: kms_api
              domains: ["*"]
              response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: "strict-transport-security", value: "max-age=31536000; includeSubDomains" }
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: "x-content-type-options", value: "nosniff" }
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: "x-frame-options", value: "DENY" }
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: "content-security-policy", value: "default-src 'self'" }
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: "referrer-policy", value: "strict-origin-when-cross-origin" }
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: "permissions-policy", value: "camera=(), microphone=(), geolocation=()" }
              routes:
              - match: { prefix: "/api/auth" }
                route: { cluster: auth_http, timeout: 30s, prefix_rewrite: "/" }
                typed_per_filter_config:
                  envoy.filters.http.local_ratelimit:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: auth_local_rate_limit
                    token_bucket: { max_tokens: 150, tokens_per_fill: 150, fill_interval: 1s }
              - match:
                  path: "/api/keycore"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: keycore_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/keycore"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: keycore_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/audit"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: audit_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/policy"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: policy_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/secrets"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: secrets_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/certs"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: certs_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/governance"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: governance_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/cloud"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: cloud_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/hyok"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: hyok_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/kmip"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: kmip_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/ekm"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: ekm_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/payment"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: payment_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/compliance"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: compliance_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/sbom"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: sbom_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/cbom"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: sbom_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/reporting"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: reporting_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/ai-gateway"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: ai_gateway_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/pqc"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: pqc_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/discovery"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: discovery_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/featureforge"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: featureforge_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/dataprotect"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: dataprotect_http, timeout: 60s, prefix_rewrite: "/" }
              - match:
                  prefix: "/api/cluster"
                  headers: [{ name: "x-tenant-id", present_match: true }]
                route: { cluster: cluster_http, timeout: 60s, prefix_rewrite: "/" }
              - match: { prefix: "/healthz" }
                route: { cluster: auth_http, timeout: 10s, prefix_rewrite: "/healthz" }
              - match: { prefix: "/api" }
                direct_response:
                  status: 400
                  body:
                    inline_string: '{"error":{"code":"MISSING_TENANT","message":"x-tenant-id header is required"}}'
              # Everything else (the SPA and its assets) is served by the
              # dashboard over mTLS.
              # Dashboard API calls (/svc/<service>/...) go straight to the
              # service over mTLS (docs/SECURITY/INTERNAL_TLS.md).
              - match: { prefix: "/svc/confidential/" }
                route: { cluster: confidential_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/featureforge/" }
                route: { cluster: featureforge_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/dataprotect/" }
                route: { cluster: dataprotect_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/governance/" }
                route: { cluster: governance_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/compliance/" }
                route: { cluster: compliance_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/ai-gateway/" }
                route: { cluster: ai_gateway_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/discovery/" }
                route: { cluster: discovery_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/reporting/" }
                route: { cluster: reporting_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/keyaccess/" }
                route: { cluster: keyaccess_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/workload/" }
                route: { cluster: workload_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/keycore/" }
                route: { cluster: keycore_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/secrets/" }
                route: { cluster: secrets_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/payment/" }
                route: { cluster: payment_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/cluster/" }
                route: { cluster: cluster_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/posture/" }
                route: { cluster: posture_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/autokey/" }
                route: { cluster: autokey_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/signing/" }
                route: { cluster: signing_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/policy/" }
                route: { cluster: policy_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/backup/" }
                route: { cluster: backup_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/certs/" }
                route: { cluster: certs_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/audit/" }
                route: { cluster: audit_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/cloud/" }
                route: { cluster: cloud_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/hyok/" }
                route: { cluster: hyok_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/kmip/" }
                route: { cluster: kmip_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/sbom/" }
                route: { cluster: sbom_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/auth/" }
                route: { cluster: auth_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/pqc/" }
                route: { cluster: pqc_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/svc/ekm/" }
                route: { cluster: ekm_http, timeout: 60s, prefix_rewrite: "/", upgrade_configs: [{ upgrade_type: websocket }] }
              - match: { prefix: "/auth" }
                route: { cluster: auth_http, timeout: 30s }
                typed_per_filter_config:
                  envoy.filters.http.local_ratelimit:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: login_local_rate_limit
                    token_bucket: { max_tokens: 20, tokens_per_fill: 10, fill_interval: 1s }
              - match: { prefix: "/healthz-edge" }
                direct_response:
                  status: 200
                  body:
                    inline_string: "Vecta KMS Envoy edge is running"
              - match: { prefix: "/" }
                route:
                  cluster: dashboard_http
                  timeout: 60s
                  upgrade_configs:
                  - upgrade_type: websocket
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  authority: "%REQ(:AUTHORITY)%"
                  bytes_received: "%BYTES_RECEIVED%"
                  bytes_sent: "%BYTES_SENT%"
                  duration_ms: "%DURATION%"
                  method: "%REQ(:METHOD)%"
                  path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  protocol: "%PROTOCOL%"
                  request_id: "%REQ(X-REQUEST-ID)%"
                  response_code: "%RESPONSE_CODE%"
                  response_flags: "%RESPONSE_FLAGS%"
                  upstream_cluster: "%UPSTREAM_CLUSTER%"
                  upstream_host: "%UPSTREAM_HOST%"
          http_filters:
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: tenant_local_rate_limit
              token_bucket:
                max_tokens: 300
                tokens_per_fill: 300
                fill_interval: 1s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value: { numerator: 100, denominator: HUNDRED }
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value: { numerator: 100, denominator: HUNDRED }
              response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header: { key: "x-rate-limited-by", value: "envoy-local" }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  - name: kmip_tcp_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 5696
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: kmip_tcp
          cluster: kmip_tcp

  clusters:
  - name: dashboard_http
    connect_timeout: 2s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: dashboard_http
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: dashboard, port_value: 5173 }}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: dashboard
        common_tls_context:
          tls_params:
            tls_minimum_protocol_version: TLSv1_3
            tls_maximum_protocol_version: TLSv1_3
            ecdh_curves: ["X25519MLKEM768", "X25519", "P-256", "P-384"]
          tls_certificate_sds_secret_configs:
          - name: internal_client
            sds_config:
              path_config_source:
                path: /etc/envoy/sds/internal_client.yaml
                watched_directory: { path: /run/vecta/runtime-certs/envoy-client }
              resource_api_version: V3
          validation_context:
            trusted_ca: { filename: /run/vecta/trust/internal-ca.crt }
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher: { exact: dashboard }
  - name: auth_http
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: auth_http
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: auth, port_value: 8001 }}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: auth
        common_tls_context:
          tls_params:
            tls_minimum_protocol_version: TLSv1_3
            tls_maximum_protocol_version: TLSv1_3
            ecdh_curves: ["X25519MLKEM768", "X25519", "P-256", "P-384"]
          tls_certificate_sds_secret_configs:
          - name: internal_client
            sds_config:
              path_config_source:
                path: /etc/envoy/sds/internal_client.yaml
                watched_directory: { path: /run/vecta/runtime-certs/envoy-client }
              resource_api_version: V3
          validation_context:
            trusted_ca: { filename: /run/vecta/trust/internal-ca.crt }
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher: { exact: auth }
  - name: keycore_http
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: keycore_http
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: keycore, port_value: 8010 }}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: keycore
        common_tls_context:
          tls_params:
            tls_minimum_protocol_version: TLSv1_3
            tls_maximum_protocol_version: TLSv1_3
            ecdh_curves: ["X25519MLKEM768", "X25519", "P-256", "P-384"]
          tls_certificate_sds_secret_configs:
          - name: internal_client
            sds_config:
              path_config_source:
                path: /etc/envoy/sds/internal_client.yaml
                watched_directory: { path: /run/vecta/runtime-certs/envoy-client }
              resource_api_version: V3
          validation_context:
            trusted_ca: { filename: /run/vecta/trust/internal-ca.crt }
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher: { exact: keycore }
  - name: secrets_http
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: secrets_http
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: secrets, port_value: 8020 }}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: secrets
        common_tls_context:
          tls_params:
            tls_minimum_protocol_version: TLSv1_3
            tls_maximum_protocol_version: TLSv1_3
            ecdh_curves: ["X25519MLKEM768", "X25519", "P-256", "P-384"]
          tls_certificate_sds_secret_configs:
          - name: internal_client
            sds_config:
              path_config_source:
                path: /etc/envoy/sds/internal_client.yaml
                watched_directory: { path: /run/vecta/runtime-certs/envoy-client }
              resource_api_version: V3
          validation_context:
            trusted_ca: { filename: /run/vecta/trust/internal-ca.crt }
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher: { exact: secrets }
  - name: certs_http
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: certs_http
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: certs, port_value: 8030 }}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: certs
        common_tls_context:
          tls_params:
            tls_minimum_protocol_version: TLSv1_3
            tls_maximum_protocol_version: TLSv1_3
            ecdh_curves: ["X25519MLKEM768", "X25519", "P-256", "P-384"]
          tls_certificate_sds_secret_configs:
          - name: internal_client
            sds_config:
              path_config_source:
                path: /etc/envoy/sds/internal_client.yaml
                watched_directory: { path: /run/vecta/runtime-certs/envoy-client }
              resource_api_version: V3
          validation_context:
            trusted_ca: { filename: /run/vecta/trust/internal-ca.crt }
            match_typed_subject_alt_names:
