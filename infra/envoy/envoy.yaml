  - name: policy_http
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: policy_http
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: policy, port_value: 8040 }}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
